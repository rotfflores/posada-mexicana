<!doctype html>

  <style>

    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }

    .copy { position: absolute; left: 78px; top: 177px; width: 650px; }
    .kicker { margin: 0 0 24px; color: #235C45; font-size: 16px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-family: "Bree Serif", Georgia, serif; font-size: 70px; line-height: 1.06; font-weight: 400; letter-spacing: -.045em; text-wrap: balance; }
    h1 .green { display: block; color: #235C45; }h1 .red { display: block; color: #C83B32; }
    .family { margin: 27px 0 8px; color: #235C45; font: 400 38px/1.2 "Bree Serif", Georgia, serif; }
    .message { margin: 0; font-size: 18px; line-height: 1.5; color: #4D6756; }

    .date::before { content: ""; width: 38px; height: 5px; background: #C83B32; }
    .scene-frame { position: absolute; right: 63px; top: 154px; width: 405px; height: 407px; padding: 10px; border: 2px solid #C83B32; border-radius: 196px 196px 10px 10px; box-shadow: 0 9px 0 #D89F4B65, 0 19px 25px #235C4520; background: #FFF6E5; }
    .scene-frame::after { content: ""; position: absolute; inset: 6px; border: 1px solid #E8AC45; border-radius: 190px 190px 7px 7px; pointer-events: none; }
    .scene { display: block; width: 100%; height: 100%; border-radius: 180px 180px 4px 4px; object-fit: cover; object-position: center 43%; }
    .flower { position: absolute; left: 684px; bottom: 49px; width: 82px; height: 82px; }
    .footer { position: absolute; bottom: 0; left: 0; width: 100%; height: 20px; background: #FFF6E5 url("assets/talavera.svg") left center / 20px 20px repeat-x; border-top: 2px solid #C83B32; }
  </style>
</head>
